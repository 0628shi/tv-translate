org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Project lives under a non-ASCII path; allow the build anyway.
android.overridePathCheck=true

# Disable the native file-watcher (unavailable in this sandbox).
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The project path contains non-ASCII characters; the Kotlin daemon mangles
# them on Windows, so compile in the Gradle JVM instead.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
